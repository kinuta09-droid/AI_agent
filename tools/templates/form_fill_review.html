<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>記入補助 - 確認画面</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  #canvas-pane { flex: 1; overflow: auto; background: #eee; padding: 16px; }
  #panel { width: 380px; overflow-y: auto; border-left: 1px solid #ccc; padding: 12px; box-sizing: border-box; }
  .row { border-bottom: 1px solid #ddd; padding: 8px 0; }
  .row.active { background: #fff3cd; }
  .row label { display: block; font-size: 12px; color: #555; }
  .row input[type=text] { width: 100%; box-sizing: border-box; padding: 4px; }
  .row .exclude { font-size: 12px; }
  #submit-btn { width: 100%; padding: 10px; font-size: 16px; margin-top: 8px; }
  #status { margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
  <div id="canvas-pane"><canvas id="canvas"></canvas></div>
  <div id="panel">
    <h3>記入内容の確認</h3>
    <p style="font-size:12px;color:#666;">自動入力された値を確認・修正してください。使わない項目はチェックを外すと印刷時に空欄になります。左の枠は内側をドラッグで移動、右下の角をドラッグでサイズ変更できます。何もない場所をドラッグすると新しい記入欄(青枠)を追加できます(生年月日など自動入力していない欄に使えます)。</p>
    <div id="rows"></div>
    <details id="other-details">
      <summary style="font-size:12px;color:#666;cursor:pointer;">説明ラベル欄・その他の検出枠 (<span id="other-count">0</span>件)</summary>
      <div id="other-rows"></div>
    </details>
    <button id="submit-btn">この内容で確定する</button>
    <button id="cancel-btn" style="width:100%;padding:6px;margin-top:6px;font-size:13px;">キャンセル (何も出力しない)</button>
    <div id="status"></div>
  </div>

<script>
const IMAGE_DATA = {{ image_data|tojson }};
const BOXES = {{ boxes|tojson }};
const DISPLAY_MAX_WIDTH = 900;
const OPACITY_PREVIEW = 0.85;  // プレビューの文字。枠線と区別がつく程度に濃く出す
// render_pdf 側の定数と対にすること (ずれるとプレビューが印刷結果と食い違う)
const PDF_PAGE_WIDTH_PT = 595.0;
const PDF_TEXT_PADDING_PT = 4.0;
const PDF_MIN_FONTSIZE_PT = 6.0;
let PT_PER_PX = 1;  // 画像1pxが何ptか。画像ロード後に確定する

const img = new Image();
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let scale = 1;
let activeBoxId = null;

img.onload = () => {
  scale = Math.min(1, DISPLAY_MAX_WIDTH / img.width);
  PT_PER_PX = PDF_PAGE_WIDTH_PT / img.width;
  canvas.width = img.width * scale;
  canvas.height = img.height * scale;
  draw();
};
img.src = IMAGE_DATA;

const HANDLE_SIZE = 10;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  for (const b of BOXES) {
    const hasValue = !!b.fill_text;
    const isActive = b.box_id === activeBoxId;
    const isManual = b.kind === 'manual';
    const isLabelCell = b.role === 'label';
    ctx.strokeStyle = isActive ? '#ff9800'
      : (isManual ? '#1976d2' : (hasValue ? '#2e7d32' : (isLabelCell ? '#d0d0d0' : '#9e9e9e')));
    ctx.lineWidth = isActive ? 3 : (isLabelCell ? 1 : 1.5);
    const bx = b.x * scale, by = b.y * scale, bw = b.w * scale, bh = b.h * scale;
    // 説明ラベル欄は破線の薄い枠にして、記入欄と一目で区別できるようにする
    if (isLabelCell && !isActive) ctx.setLineDash([3, 3]);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.setLineDash([]);
    if (b.fill_text) {
      // 実際に印刷される文字をその場に描く。render_pdf と同じ規則で計算するので、
      // ここでの見た目が印刷結果になる (枠からはみ出す/小さすぎる文字を出す前に気付ける)。
      //   PDF: 1画像px = PT_PER_PX pt / キャンバス: 1画像px = scale キャンバスpx
      const ptToCanvas = scale / PT_PER_PX;                    // pt -> キャンバスpx
      const padding = PDF_TEXT_PADDING_PT * ptToCanvas;
      const basePt = Math.max(8, Math.min(14, b.h * PT_PER_PX * 0.6));
      let fontSize = basePt * ptToCanvas;
      const minSize = PDF_MIN_FONTSIZE_PT * ptToCanvas;
      const maxWidth = bw - padding * 2;
      ctx.font = `${fontSize}px sans-serif`;
      while (fontSize > minSize && ctx.measureText(b.fill_text).width > maxWidth) {
        fontSize -= 0.5 * ptToCanvas;
        ctx.font = `${fontSize}px sans-serif`;
      }
      ctx.fillStyle = '#000';
      ctx.globalAlpha = OPACITY_PREVIEW;
      ctx.fillText(b.fill_text, bx + padding, by + bh * 0.7);
      ctx.globalAlpha = 1.0;
    }
    if (isActive) {
      // 右下のリサイズハンドル (ドラッグで枠の位置・大きさを調整できることの目印)
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(bx + bw - HANDLE_SIZE, by + bh - HANDLE_SIZE, HANDLE_SIZE, HANDLE_SIZE);
    }
  }
  if (creatingRect) {
    ctx.strokeStyle = '#1976d2';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(creatingRect.x, creatingRect.y, creatingRect.w, creatingRect.h);
    ctx.setLineDash([]);
  }
}

// --- ドラッグでの枠の移動・リサイズ・新規追加 ---
// 既存の枠の上でのドラッグは移動/リサイズ、何も無い場所でのドラッグは新規の枠を作る
// (自動検出が拾えなかった欄や、生年月日のように自動入力しない欄を手動で埋めるため)。
let drag = null;
let creatingRect = null;
let nextBoxId = Math.max(-1, ...BOXES.map(b => b.box_id)) + 1;
const MIN_CREATE_SIZE = 15; // これ未満のドラッグは誤クリックとみなし新規作成しない

function canvasPos(evt) {
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function boxAt(cx, cy) {
  for (let i = BOXES.length - 1; i >= 0; i--) {
    const b = BOXES[i];
    const bx = b.x * scale, by = b.y * scale, bw = b.w * scale, bh = b.h * scale;
    if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) {
      const onHandle = cx >= bx + bw - HANDLE_SIZE && cy >= by + bh - HANDLE_SIZE;
      return { box: b, mode: onHandle ? 'resize' : 'move' };
    }
  }
  return null;
}

canvas.addEventListener('mousedown', (evt) => {
  const pos = canvasPos(evt);
  const hit = boxAt(pos.x, pos.y);
  if (hit) {
    drag = { box: hit.box, mode: hit.mode, startX: pos.x, startY: pos.y,
             orig: { x: hit.box.x, y: hit.box.y, w: hit.box.w, h: hit.box.h } };
    activeBoxId = hit.box.box_id;
    revealRow(hit.box.box_id);
  } else {
    drag = { mode: 'create', startX: pos.x, startY: pos.y };
  }
  draw();
});

canvas.addEventListener('mousemove', (evt) => {
  const pos = canvasPos(evt);
  if (!drag) {
    const hit = boxAt(pos.x, pos.y);
    canvas.style.cursor = hit ? (hit.mode === 'resize' ? 'nwse-resize' : 'move') : 'crosshair';
    return;
  }
  if (drag.mode === 'create') {
    creatingRect = {
      x: Math.min(drag.startX, pos.x), y: Math.min(drag.startY, pos.y),
      w: Math.abs(pos.x - drag.startX), h: Math.abs(pos.y - drag.startY),
    };
    draw();
    return;
  }
  const dx = (pos.x - drag.startX) / scale;
  const dy = (pos.y - drag.startY) / scale;
  if (drag.mode === 'move') {
    drag.box.x = Math.round(drag.orig.x + dx);
    drag.box.y = Math.round(drag.orig.y + dy);
  } else {
    drag.box.w = Math.max(10, Math.round(drag.orig.w + dx));
    drag.box.h = Math.max(10, Math.round(drag.orig.h + dy));
  }
  draw();
});

window.addEventListener('mouseup', () => {
  if (drag && drag.mode === 'create' && creatingRect
      && creatingRect.w >= MIN_CREATE_SIZE && creatingRect.h >= MIN_CREATE_SIZE) {
    const b = {
      box_id: nextBoxId++,
      x: Math.round(creatingRect.x / scale), y: Math.round(creatingRect.y / scale),
      w: Math.round(creatingRect.w / scale), h: Math.round(creatingRect.h / scale),
      kind: 'manual', label_text: '(手動追加)', label_score: 1.0,
      role: 'input', label_area_ratio: 0.0, category: '手動追加', fill_text: '',
    };
    BOXES.push(b);
    addRow(b);
    activeBoxId = b.box_id;
    revealRow(b.box_id);
  }
  drag = null;
  creatingRect = null;
  draw();
});

const rowsDiv = document.getElementById('rows');
const otherRowsDiv = document.getElementById('other-rows');
const otherDetails = document.getElementById('other-details');
const otherCount = document.getElementById('other-count');
const SECONDARY_CATEGORIES = new Set(['不明', 'その他']);

// 分類できた記入欄を上に、それ以外 (説明ラベル欄・注記文の誤検出) は折りたたみに入れる。
// 実書類では後者が大半で、確認すべき十数件が埋もれていた。
// role==='label' は「右の欄に何を書くかを説明する欄」(「氏名」と印字された左のセル) で、
// そもそも書き込む場所ではない。
function isPrimary(b) {
  if (b.kind === 'manual') return true;
  if (b.role === 'label') return false;
  return !!b.label_text && !SECONDARY_CATEGORIES.has(b.category || '不明');
}

function addRow(b) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.boxId = b.box_id;
  const label = b.label_text || '(ラベルなし)';
  row.innerHTML = `
    <label>[${b.box_id}] ${escapeHtml(label)} (${escapeHtml(b.category || '不明')})</label>
    <input type="text" value="${escapeHtml(b.fill_text || '')}">
    <label class="exclude"><input type="checkbox" ${b.fill_text ? 'checked' : ''}> この内容を使う</label>
  `;
  const textInput = row.querySelector('input[type=text]');
  const checkbox = row.querySelector('input[type=checkbox]');
  row.addEventListener('mouseenter', () => { activeBoxId = b.box_id; draw(); });
  row.addEventListener('mouseleave', () => { activeBoxId = null; draw(); });
  textInput.addEventListener('input', () => {
    b.fill_text = textInput.value;
    checkbox.checked = !!textInput.value;
    draw();
  });
  checkbox.addEventListener('change', () => {
    if (!checkbox.checked) { textInput.value = ''; b.fill_text = ''; }
    draw();
  });
  const container = isPrimary(b) ? rowsDiv : otherRowsDiv;
  insertRowInDocumentOrder(container, row, b);
  if (container === otherRowsDiv) otherCount.textContent = otherRowsDiv.children.length;
  return row;
}

// 一覧の並び順を書類上の実際の位置 (上から下、同じ高さなら左から右) に合わせる。
// 個人番号→氏名→住所のように、書類を見ながら上から順に埋められるようにするため
// (ユーザー要望)。box_id は検出順であって書類上の位置とは一致しない。
function insertRowInDocumentOrder(container, row, b) {
  for (const existing of container.children) {
    const other = BOXES.find(o => o.box_id === Number(existing.dataset.boxId));
    if (!other) continue;
    if (b.y < other.y - 5 || (Math.abs(b.y - other.y) <= 5 && b.x < other.x)) {
      container.insertBefore(row, existing);
      return;
    }
  }
  container.appendChild(row);
}

// キャンバス上で枠をクリックしたとき、対応する行を見えるところまでスクロールする
function revealRow(boxId) {
  const row = document.querySelector(`.row[data-box-id="${boxId}"]`);
  if (!row) return;
  if (otherRowsDiv.contains(row)) otherDetails.open = true;
  row.scrollIntoView({ block: 'nearest' });
}

for (const b of BOXES) {
  addRow(b);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.textContent = '送信中...';
  try {
    const resp = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ boxes: BOXES }),
    });
    if (resp.ok) {
      status.textContent = '確定しました。このタブは閉じて構いません。';
      document.getElementById('submit-btn').disabled = true;
    } else {
      status.textContent = '送信に失敗しました。';
    }
  } catch (e) {
    status.textContent = '送信に失敗しました: ' + e;
  }
});

document.getElementById('cancel-btn').addEventListener('click', async () => {
  if (!confirm('キャンセルして終了します。PDFは出力されません。よろしいですか？')) return;
  const status = document.getElementById('status');
  try {
    await fetch('/cancel', { method: 'POST' });
    status.textContent = 'キャンセルしました。このタブは閉じて構いません。';
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('cancel-btn').disabled = true;
  } catch (e) {
    status.textContent = 'キャンセルに失敗しました: ' + e;
  }
});
</script>
</body>
</html>
