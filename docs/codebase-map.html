  :root {

  }

    :root { --bg: #f7f8fb; --panel: #ffffff; --border: #e1e4ec; --text: #1c1f2a; --muted: #656b80; --accent: #3b5bdb; --accent2: #c9184a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 32px 18px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 32px 60px; display: grid; gap: 22px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; }
  section h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .stat { text-align: center; padding: 10px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .path { color: var(--muted); }
  .pill { display: inline-block; background: var(--border); border-radius: 5px; padding: 1px 7px; font-size: 12px; font-family: var(--mono); }
  ul.compact { margin: 0; padding-left: 18px; }
  ul.compact li { margin: 3px 0; }
  .bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .barwrap { background: var(--border); border-radius: 3px; height: 6px; width: 100%; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 6px; }
  .gist { color: var(--muted); }
</style>
</head>

<script>
const data = JSON.parse(document.getElementById('graph-data').textContent);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

document.getElementById('hdr-meta').textContent =
  `${data.meta.git_branch}@${data.meta.git_commit} · generated ${data.meta.generated_at} · ${data.meta.launcher}`;

function section(title, innerHtml) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${title}</h2>${innerHtml}`;
  app.appendChild(s);
}

const gs = data.meta.graph_stats;
section('Graph Stats', `
  <div class="grid3">
    <div class="stat"><b>${gs.files}</b><span>files</span></div>
    <div class="stat"><b>${gs.total_nodes.toLocaleString()}</b><span>nodes</span></div>
    <div class="stat"><b>${gs.total_edges.toLocaleString()}</b><span>edges</span></div>
  </div>
  <p class="gist" style="margin-top:10px">Source: ${esc(data.meta.graph_source)} · languages: ${gs.languages.join(', ')}</p>
`);

section('Entry Points', `<table><tbody>${data.entry_points.map(e =>
  `<tr><td><code>${esc(e.file)}</code></td><td>${esc(e.role)}</td></tr>`).join('')}</tbody></table>`);

section('Directory Map', `<table><tbody>${Object.entries(data.directory_map).map(([k,v]) =>
  `<tr><td><span class="pill">${esc(k)}</span></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`);

section('Tools (documented)', `
  <table><tbody>${data.documented_tools.map(t =>
    `<tr><td><code>tools/${esc(t.file)}</code></td><td>${esc(t.purpose)}</td></tr>`).join('')}</tbody></table>
  <details><summary>All ${data.all_tools.length} tools/*.py files</summary>
    <ul class="compact mono">${data.all_tools.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
  </details>
`);

const maxDeg = Math.max(...data.hub_nodes.map(h => typeof h.total_degree === 'number' ? h.total_degree : 0));
section('Hub Nodes (highest blast radius)', `<table><tbody>${data.hub_nodes.map(h => {
  const deg = typeof h.total_degree === 'number' ? h.total_degree : 0;
  const pct = maxDeg ? Math.round(deg / maxDeg * 100) : 0;
  return `<tr><td><code>${esc(h.name)}</code><div class="path">${esc(h.file)}</div>${h.note ? `<div class="gist">${esc(h.note)}</div>` : ''}</td>
    <td style="width:140px"><div class="barwrap"><div class="bar" style="width:${pct}%"></div></div><span class="mono">${h.total_degree}</span></td></tr>`;
}).join('')}</tbody></table>`);

section('Top Execution Flows', `<table><tbody>${data.top_execution_flows.map(f =>
  `<tr><td><code>${esc(f.entry)}</code></td><td class="mono">criticality ${f.criticality}</td><td class="mono">${f.node_count} nodes</td></tr>`).join('')}</tbody></table>`);

section('Communities', `<table><tbody>${data.communities.map(c =>
  `<tr><td>${esc(c.name)}</td><td class="mono">${c.size} nodes</td><td class="mono">cohesion ${c.cohesion}</td></tr>`).join('')}</tbody></table>`);

section('Known Bug Pattern Index', `<p class="gist">Full text: <code>.claude/rules/known-bug-patterns.md</code></p>
  <table><tbody>${data.known_bug_pattern_index.map(p =>
    `<tr><td class="mono">${esc(p.id)}</td><td>${esc(p.title)}</td><td class="gist">${esc(p.gist)}</td></tr>`).join('')}</tbody></table>`);

section('Domain Skills (auto-loaded)', `<table><tbody>${data.skills_by_domain.map(s =>
  `<tr><td><code>${esc(s.skill)}</code></td><td class="gist">${esc(s.scope)}</td></tr>`).join('')}</tbody></table>`);

section('Quick Commands', `<ul class="compact mono">${data.quick_commands.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`);
</script>
